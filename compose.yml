services:
  db:
    image: docker.io/postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: civic_platform
      POSTGRES_USER: civic_user
      POSTGRES_PASSWORD: devpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civic_user -d civic_platform"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/workspace:Z
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: sh -c "python manage.py bootstrap && python manage.py runserver 0.0.0.0:8000 && sleep infinity"
    depends_on:
      # service_started, não service_healthy: no Podman sem systemd o healthcheck
      # nunca roda e o compose travaria. O bootstrap já espera o banco aceitar conexão.
      db:
        condition: service_started
      verifier:
        condition: service_started

  verifier:
    build:
      context: ./verifier
      dockerfile: Dockerfile
    env_file:
      - ./verifier/.env
    volumes:
      - verifier_data:/data
    ports:
      - "9000:9000"

volumes:
  pgdata:
  verifier_data:
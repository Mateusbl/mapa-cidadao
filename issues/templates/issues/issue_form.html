{% extends 'issues/base.html' %}

{% block title %}Novo Issue{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<div id="map" style="height: 400px; margin-bottom: 1rem;"></div>


<h1>Reportar novo problema</h1>

<form method="post">
    {% csrf_token %}
    <div>
        <label>Título:</label>
        <input type="text" name="title" maxlength="200" value="{{ form_data.title }}" required>
    </div>
    <div>
        <label>Descrição:</label>
        <textarea name="description" required>{{ form_data.description }}</textarea>
    </div>
    <div>
        <label>Município:</label>
        <select name="municipio" required>
            <option value="">Selecione</option>
            {% for m in municipios %}
                <option value="{{ m.id }}" {% if form_data.municipio == m.id|stringformat:"s" %}selected{% endif %}>{{ m.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div>
        <button type="button" id="get-location-btn">📍 Usar minha localização atual</button>
        <span id="location-status">Ou clique no mapa acima para marcar o local</span>
    </div>
    <input type="hidden" name="lat" id="id_lat" value="{{ form_data.lat }}" required>
    <input type="hidden" name="lng" id="id_lng" value="{{ form_data.lng }}" required>
    <button type="submit">Enviar</button>
</form>

<script>
    // Centro inicial: Rio de Janeiro, ajusta o zoom conforme necessário
    const map = L.map('map').setView([-22.9, -43.2], 8);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
        maxZoom: 19,
    }).addTo(map);

    let marker = null;

    function setLocation(lat, lng) {
        document.getElementById('id_lat').value = lat;
        document.getElementById('id_lng').value = lng;
        document.getElementById('location-status').textContent = 'Local marcado ✓';

        if (marker) {
            marker.setLatLng([lat, lng]);
        } else {
            marker = L.marker([lat, lng]).addTo(map);
        }
        map.setView([lat, lng], 15);
    }

    // depois de um erro de validação, mostra de novo o local que já tinha sido marcado
    const prevLat = parseFloat(document.getElementById('id_lat').value);
    const prevLng = parseFloat(document.getElementById('id_lng').value);
    if (Number.isFinite(prevLat) && Number.isFinite(prevLng)) {
        setLocation(prevLat, prevLng);
    }

    // Clique no mapa marca o local
    map.on('click', function(e) {
        setLocation(e.latlng.lat, e.latlng.lng);
    });

    // Botão de geolocalização continua funcionando, agora também atualiza o mapa
    document.getElementById('get-location-btn').addEventListener('click', function() {
        const status = document.getElementById('location-status');
        status.textContent = 'Obtendo localização...';

        if (!navigator.geolocation) {
            status.textContent = 'Seu navegador não suporta geolocalização.';
            return;
        }

        navigator.geolocation.getCurrentPosition(
            function(position) {
                setLocation(position.coords.latitude, position.coords.longitude);
            },
            function(error) {
                status.textContent = 'Não foi possível obter a localização. Clique no mapa pra marcar manualmente.';
            }
        );
    });
</script>
{% endblock %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Mapa Cidadão{% endblock %}</title>
</head>
<body>
    <nav>
        <a href="{% url 'issues:issue_list' %}">Início</a>
        {% if user.is_authenticated %}
            <a href="{% url 'issues:issue_create' %}">Novo Issue</a>
            <span>Olá, {{ user.username }}</span>
            <form method="post" action="{% url 'logout' %}" style="display:inline">
                {% csrf_token %}
                <button type="submit">Sair</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Entrar</a>
        {% endif %}
    </nav>

    {% if messages %}
        <ul>
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
